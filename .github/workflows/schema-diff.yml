name: Schema Diff Gate
on:
  pull_request:
    paths:
      - 'src/schemas/**'
      - 'src/components/item-types/renderers/**'

jobs:
  schema-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to see the base branch for diffing

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Schema Generation
        run: npx tsx scripts/generateSchema.ts

      - name: Check for Schema/Renderer Drift
        run: npx tsx scripts/schemaDiff.ts
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Run Replay Tests
        run: npm test -- --testPathPatterns replay-payloads
